[project]
name = "seoul-urban-research-agent"
version = "0.1.0"
description = "Seoul Urban Research Agent - AI-powered urban policy research system for Seoul Institute"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.1.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "matplotlib>=3.7.0",
    "folium>=0.15.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["seoul_research_agent*"]
